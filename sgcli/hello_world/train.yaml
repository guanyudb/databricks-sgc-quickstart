# SGC Hello World — SGCLI Workload Definition
#
# Submit this job with:
#   sgcli run -f train.yaml --watch
#
# Before running, update:
#   1. experiment_name — use a unique name
#   2. code_source.snapshot.repo_path — point to your local clone of this repo

experiment_name: sgc-hello-world
run_name: hello-world-test

environment:
  env_variables:
    NCCL_DEBUG: "INFO"
  dependencies: dependencies.yaml

# A10 = 1 GPU/node, so gpus:2 means 2 A10 nodes — minimum for a multi-node hello world.
# For H100 (8 GPUs/node) use gpus:8 (single node) or gpus:16 (2 nodes).
compute:
  gpus: 2
  gpu_type: a10

max_retries: 0

# repo_path is relative to this train.yaml (sgcli resolves YAML-relative paths automatically).
# ../.. points to the repo root — no manual editing needed if you keep the file structure intact.
code_source:
  type: snapshot
  snapshot:
    allow_uncommitted: true
    repo_path: ../..

command: |-
  cd $HOME/databricks-sgc-quickstart/sgcli/hello_world
  set -euo pipefail
  echo ">>> SGC Hello World — Starting"
  echo ">>> Node Rank: ${NODE_RANK:-${POD_RANK:-0}}"
  echo ">>> World Size: ${WORLD_SIZE:-1}"
  # Manual torchrun settings for simplicity.
  NNODES=2
  NPROC_PER_NODE=1
  NODE_RANK_VALUE="${NODE_RANK:-${POD_RANK:-0}}"
  MASTER_ADDR_VALUE="${MASTER_ADDR}"
  MASTER_PORT_VALUE="${MASTER_PORT}"
  echo ">>> Launching torchrun with nnodes=${NNODES}, nproc_per_node=${NPROC_PER_NODE}"
  torchrun \
    --nnodes="${NNODES}" \
    --nproc-per-node="${NPROC_PER_NODE}" \
    --node-rank="${NODE_RANK_VALUE}" \
    --master-addr="${MASTER_ADDR_VALUE}" \
    --master-port="${MASTER_PORT_VALUE}" \
    train.py
